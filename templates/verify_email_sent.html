<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Your Email — Kōdō</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png?v={{ asset_version('favicon-32.png') }}">
  <link rel="icon" type="image/png" sizes="512x512" href="/static/favicon-512.png?v={{ asset_version('favicon-512.png') }}">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v={{ asset_version('apple-touch-icon.png') }}">
  <meta name="theme-color" content="#4A7FA5">
  <link rel="preload" href="/static/fonts/SweetSansProRegular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/SweetSansProMedium.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/SweetSansProBold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/SweetSansProExLight.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: 'Sweet Sans Pro';
      src: url('/static/fonts/SweetSansProExLight.woff2') format('woff2'),
           url('/static/fonts/SweetSansProExLight.otf') format('opentype');
      font-weight: 200;
      font-style: normal;
      font-display: block;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: 'Sweet Sans Pro', sans-serif;
      font-weight: 200;
      background: #0A0A0A;
      color: #F0F0EE;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    .top-bar {
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .top-bar__logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #F0F0EE;
    }
    .top-bar-logo-img { height: 32px; width: auto; display: block; }
    .top-bar__back { font-size: 13px; color: #888888; text-decoration: none; }
    .top-bar__back:hover { color: #F0F0EE; }

    .auth-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .auth-card {
      background: #141414;
      border: 1px solid #242424;
      width: 100%;
      max-width: 400px;
      padding: 40px;
      border-radius: 8px;
      text-align: center;
    }
    .auth-eyebrow {
      font-family: 'Sweet Sans Pro', sans-serif;
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #4A7FA5;
      margin-bottom: 12px;
    }
    .auth-heading {
      font-family: 'Sweet Sans Pro', sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #F0F0EE;
      margin-bottom: 12px;
    }
    .auth-sub {
      font-size: 0.875rem;
      color: #888888;
      line-height: 1.6;
      margin-bottom: 8px;
    }
    .auth-email {
      font-size: 0.875rem;
      color: #F0F0EE;
      font-weight: 500;
      margin-bottom: 28px;
      word-break: break-all;
    }

    .btn-secondary {
      display: inline-block;
      width: 100%;
      padding: 12px;
      background: none;
      color: #F0F0EE;
      font-family: 'Sweet Sans Pro', sans-serif;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border: 1px solid #242424;
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.15s, color 0.15s;
      box-sizing: border-box;
    }
    .btn-secondary:hover { border-color: #4A7FA5; color: #4A7FA5; }

    .auth-note-inline {
      font-size: 0.75rem;
      color: #444444;
      margin-top: 18px;
      line-height: 1.6;
    }

    .auth-footer {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #242424;
      text-align: center;
    }
    .auth-footer p { font-size: 0.8125rem; color: #888888; line-height: 1.6; }
    .auth-footer a { color: #4A7FA5; text-decoration: none; font-weight: 500; }
    .auth-footer a:hover { text-decoration: underline; }

    .auth-note {
      text-align: center;
      padding: 20px;
      font-size: 0.75rem;
      color: #444444;
    }
  </style>
</head>
<body>

<div class="top-bar">
  <a href="/" class="top-bar__logo">
    <img src="/static/images/logo_white.png" alt="Kōdō Hospitality" class="top-bar-logo-img">
  </a>
  <a href="/login" class="top-bar__back">← Back to log in</a>
</div>

<div class="auth-wrap">
  <div class="auth-card">
    <p class="auth-eyebrow">Check Your Email</p>
    <h1 class="auth-heading">Confirm your account</h1>
    <p class="auth-sub">We've sent a confirmation link to</p>
    <p class="auth-email">{{ email }}</p>

    <button type="button" class="btn-secondary" id="resendBtn" data-email="{{ email }}">Resend Email</button>
    <p class="auth-note-inline" id="resendMsg" style="display:none;"></p>

    <p class="auth-note-inline">Didn't get it? Check your spam folder, or the link may take a minute to arrive.</p>
  </div>
</div>

<p class="auth-note">© 2026 Kōdō Hospitality · Morocco Hospitality Intelligence</p>

<script>
(function() {
  const btn = document.getElementById('resendBtn');
  const msg = document.getElementById('resendMsg');
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    btn.textContent = 'Sending…';
    try {
      const res = await fetch('/resend-verification', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: btn.dataset.email }),
      });
      const data = await res.json();
      msg.textContent = data.message || 'If an account exists with that email, a confirmation link has been sent.';
      msg.style.display = 'block';
    } catch (e) {
      msg.textContent = 'Something went wrong. Please try again in a moment.';
      msg.style.display = 'block';
    } finally {
      btn.textContent = 'Resend Email';
      btn.disabled = false;
    }
  });
})();
</script>

</body>
</html>
