<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Kōdō</title>
  <link rel="icon" type="image/png" href="/static/images/kodologo.png">
  <link rel="apple-touch-icon" href="/static/images/kodologo.png">
  <meta name="theme-color" content="#B87860">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: 'Manrope', sans-serif;
      background: #0A0A0A;
      color: #F0F0EE;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Top bar ── */
    .top-bar {
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .top-bar__logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #F0F0EE;
    }
    .top-bar-logo-img {
      height: 24px;
      width: auto;
      display: block;
    }
    .top-bar__back {
      font-size: 13px;
      color: #888888;
      text-decoration: none;
    }
    .top-bar__back:hover { color: #F0F0EE; }

    /* ── Main ── */
    .auth-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .auth-card {
      background: #141414;
      border: 1px solid #242424;
      width: 100%;
      max-width: 400px;
      padding: 40px;
      border-radius: 8px;
    }
    .auth-eyebrow {
      font-family: 'Manrope', sans-serif;
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #B87860;
      margin-bottom: 12px;
    }
    .auth-heading {
      font-family: 'Space Mono', monospace;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #F0F0EE;
      margin-bottom: 12px;
    }
    .auth-sub {
      font-size: 0.875rem;
      color: #888888;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    /* ── Form ── */
    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #888888;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 10px 12px;
      font-family: 'Manrope', sans-serif;
      font-size: 0.9375rem;
      color: #F0F0EE;
      background: #1C1C1C;
      border: 1px solid #242424;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }
    .form-input:focus { border-color: #B87860; background: #1C1C1C; }
    .form-input::placeholder { color: #444444; }

    /* ── Status messages ── */
    .auth-error, .auth-success {
      font-size: 0.8125rem;
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 18px;
      line-height: 1.5;
    }
    .auth-error {
      background: rgba(200,90,90,0.10);
      border: 1px solid rgba(200,90,90,0.30);
      color: #E07070;
    }
    .auth-success {
      background: rgba(90,138,90,0.10);
      border: 1px solid rgba(90,138,90,0.30);
      color: #7AB07A;
    }

    /* ── Button ── */
    .btn-primary {
      width: 100%;
      padding: 12px;
      background: transparent;
      color: #B87860;
      font-family: 'Manrope', sans-serif;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border: 1px solid #B87860;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      margin-top: 4px;
    }
    .btn-primary:hover:not(:disabled) { background: #B87860; color: #0A0A0A; }
    .btn-primary:active:not(:disabled) { background: #A06848; border-color: #A06848; color: #0A0A0A; }
    .btn-primary:disabled { opacity: 0.6; cursor: default; }

    /* ── Footer links ── */
    .auth-footer {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #242424;
      text-align: center;
    }
    .auth-footer p { font-size: 0.8125rem; color: #888888; line-height: 1.6; }
    .auth-footer a { color: #B87860; text-decoration: none; font-weight: 500; }
    .auth-footer a:hover { text-decoration: underline; }

    .auth-note {
      text-align: center;
      padding: 20px;
      font-size: 0.75rem;
      color: #444444;
    }
  </style>
</head>
<body>

<div class="top-bar">
  <a href="/" class="top-bar__logo">
    <img src="/static/images/kodo2.png" alt="Kōdō Hospitality" class="top-bar-logo-img">
  </a>
  <a href="/login" class="top-bar__back">← Back to log in</a>
</div>

<div class="auth-wrap">
  <div class="auth-card">
    <p class="auth-eyebrow">Account Recovery</p>
    <h1 class="auth-heading">Forgot your password?</h1>
    <p class="auth-sub">Enter your email address and we'll send you a link to reset your password.</p>

    <div id="forgotError" class="auth-error" style="display:none;"></div>
    <div id="forgotSuccess" class="auth-success" style="display:none;">
      ✓ If an account exists with that email you will receive a reset link shortly.
    </div>

    <form id="forgotForm">
      <div class="form-group">
        <label class="form-label" for="resetEmail">Email address</label>
        <input class="form-input" type="email" id="resetEmail" name="email"
               placeholder="you@company.com" required autocomplete="email">
      </div>
      <button type="submit" class="btn-primary">Send Reset Link →</button>
    </form>

    <div class="auth-footer">
      <p><a href="/login">← Back to log in</a></p>
    </div>
  </div>
</div>

<p class="auth-note">© 2026 Kōdō Hospitality · Morocco Hospitality Intelligence</p>

<script>
(function() {
  const form = document.getElementById('forgotForm');
  const successEl = document.getElementById('forgotSuccess');
  const errorEl = document.getElementById('forgotError');

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const email = document.getElementById('resetEmail').value;
    const btn = form.querySelector('button[type="submit"]');
    btn.textContent = 'Sending…';
    btn.disabled = true;
    errorEl.style.display = 'none';

    try {
      const res = await fetch('/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      const data = await res.json();
      if (res.ok) {
        successEl.style.display = 'block';
        form.style.display = 'none';
      } else {
        errorEl.textContent = data.error || 'Something went wrong. Please try again.';
        errorEl.style.display = 'block';
      }
    } catch (err) {
      errorEl.textContent = 'Something went wrong. Please try again.';
      errorEl.style.display = 'block';
    } finally {
      btn.textContent = 'Send Reset Link →';
      btn.disabled = false;
    }
  });
})();
</script>

</body>
</html>
