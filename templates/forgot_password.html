<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Kodo</title>
  <link rel="icon" href="/static/img/brand/favicon-light.ico?v={{ asset_version('img/brand/favicon-light.ico') }}" sizes="any" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/img/brand/favicon-light-16.png?v={{ asset_version('img/brand/favicon-light-16.png') }}" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/img/brand/favicon-light-32.png?v={{ asset_version('img/brand/favicon-light-32.png') }}" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" sizes="48x48" href="/static/img/brand/favicon-light-48.png?v={{ asset_version('img/brand/favicon-light-48.png') }}" media="(prefers-color-scheme: light)">
  <link rel="icon" href="/static/img/brand/favicon-dark.ico?v={{ asset_version('img/brand/favicon-dark.ico') }}" sizes="any" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/img/brand/favicon-dark-16.png?v={{ asset_version('img/brand/favicon-dark-16.png') }}" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/img/brand/favicon-dark-32.png?v={{ asset_version('img/brand/favicon-dark-32.png') }}" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" sizes="48x48" href="/static/img/brand/favicon-dark-48.png?v={{ asset_version('img/brand/favicon-dark-48.png') }}" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/img/brand/apple-touch-icon.png?v={{ asset_version('img/brand/apple-touch-icon.png') }}">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#191918" media="(prefers-color-scheme: dark)">
  <link rel="preload" href="/static/fonts/SweetSansProRegular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/SweetSansProMedium.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/SweetSansProBold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/SweetSansProExLight.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/static/js/theme.js?v={{ asset_version('js/theme.js') }}"></script>
  <link rel="stylesheet" href="/static/css/tokens.css?v={{ asset_version('css/tokens.css') }}">
  <style>
    @font-face {
      font-family: 'Sweet Sans Pro';
      src: url('/static/fonts/SweetSansProExLight.woff2') format('woff2'),
           url('/static/fonts/SweetSansProExLight.otf') format('opentype');
      font-weight: 200;
      font-style: normal;
      font-display: block;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: 'Sweet Sans Pro', sans-serif;
      font-weight: 200;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Top bar ── */
    .top-bar {
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .top-bar__logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text);
    }
    .top-bar-logo-img {
      height: 32px;
      width: auto;
      display: block;
    }
    .top-bar__back {
      font-size: 13px;
      color: var(--text-2);
      text-decoration: none;
    }
    .top-bar__back:hover { color: var(--text); }

    /* ── Main ── */
    .auth-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .auth-card {
      background: var(--bg-alt);
      border: 1px solid var(--border);
      width: 100%;
      max-width: 400px;
      padding: 40px;
      border-radius: 8px;
    }
    .auth-eyebrow {
      font-family: 'Sweet Sans Pro', sans-serif;
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-2);
      margin-bottom: 12px;
    }
    .auth-heading {
      font-family: 'Sweet Sans Pro', sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
      margin-bottom: 12px;
    }
    .auth-sub {
      font-size: 0.875rem;
      color: var(--text-2);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    /* ── Form ── */
    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-2);
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 10px 12px;
      font-family: 'Sweet Sans Pro', sans-serif;
      font-size: 0.9375rem;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }
    .form-input:focus { border-color: var(--action); background: var(--bg); }
    .form-input::placeholder { color: var(--text-3); }

    /* ── Status messages ── */
    .auth-error, .auth-success {
      font-size: 0.8125rem;
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 18px;
      line-height: 1.5;
    }
    .auth-error {
      background: var(--negative-tint);
      border: 1px solid transparent;
      color: var(--negative);
    }
    .auth-success {
      background: var(--positive-tint);
      border: 1px solid transparent;
      color: var(--positive);
    }

    /* ── Button ── */
    .btn-primary {
      width: 100%;
      padding: 12px;
      background: var(--action);
      color: var(--on-action);
      font-family: 'Sweet Sans Pro', sans-serif;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border: 1px solid var(--action);
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      margin-top: 4px;
    }
    .btn-primary:hover:not(:disabled) { background: var(--action-hover); border-color: var(--action-hover); }
    .btn-primary:active:not(:disabled) { background: var(--action-press); border-color: var(--action-press); color: var(--on-action); }
    .btn-primary:disabled { opacity: 0.6; cursor: default; }

    /* ── Footer links ── */
    .auth-footer {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      text-align: center;
    }
    .auth-footer p { font-size: 0.8125rem; color: var(--text-2); line-height: 1.6; }
    .auth-footer a { color: var(--action-text); text-decoration: none; font-weight: 500; }
    .auth-footer a:hover { text-decoration: underline; }

    .auth-note {
      text-align: center;
      padding: 20px;
      font-size: 0.75rem;
      color: var(--text-2);
    }
      /* Logo follows the theme (tokens.css / theme.js set <html data-theme>) */
    .top-bar-logo-img.logo-light { display: none; }
    :root:not([data-theme="dark"]) .top-bar-logo-img.logo-dark { display: none; }
    :root:not([data-theme="dark"]) .top-bar-logo-img.logo-light { display: block; }
  </style>
</head>
<body>
<script>KodoTheme.applyBody('light');</script>

<div class="top-bar">
  <a href="/" class="top-bar__logo">
    <img src="/static/img/brand/kodo-logo-dark-600.png?v={{ asset_version('img/brand/kodo-logo-dark-600.png') }}"
         srcset="/static/img/brand/kodo-logo-dark-600.png?v={{ asset_version('img/brand/kodo-logo-dark-600.png') }} 600w, /static/img/brand/kodo-logo-dark-1200.png?v={{ asset_version('img/brand/kodo-logo-dark-1200.png') }} 1200w" sizes="146px"
         width="600" height="131" alt="Kodo"
         class="top-bar-logo-img logo-dark">
    <img src="/static/img/brand/kodo-logo-light-600.png?v={{ asset_version('img/brand/kodo-logo-light-600.png') }}"
         srcset="/static/img/brand/kodo-logo-light-600.png?v={{ asset_version('img/brand/kodo-logo-light-600.png') }} 600w, /static/img/brand/kodo-logo-light-1200.png?v={{ asset_version('img/brand/kodo-logo-light-1200.png') }} 1200w" sizes="146px"
         width="600" height="131" alt="Kodo"
         class="top-bar-logo-img logo-light">
  </a>
  <a href="/login" class="top-bar__back">← Back to log in</a>
</div>

<div class="auth-wrap">
  <div class="auth-card">
    <p class="auth-eyebrow">Account Recovery</p>
    <h1 class="auth-heading">Forgot your password?</h1>
    <p class="auth-sub">Enter your email address and we'll send you a link to reset your password.</p>

    <div id="forgotError" class="auth-error" style="display:none;"></div>
    <div id="forgotSuccess" class="auth-success" style="display:none;">
      ✓ If an account exists with that email you will receive a reset link shortly.
    </div>

    <form id="forgotForm">
      <div class="form-group">
        <label class="form-label" for="resetEmail">Email address</label>
        <input class="form-input" type="email" id="resetEmail" name="email"
               placeholder="you@company.com" required autocomplete="email">
      </div>
      <button type="submit" class="btn-primary">Send Reset Link →</button>
    </form>

    <div class="auth-footer">
      <p><a href="/login">← Back to log in</a></p>
    </div>
  </div>
</div>

<p class="auth-note">© 2026 Kodo Hospitality · Morocco Hospitality Intelligence</p>

<script>
(function() {
  const form = document.getElementById('forgotForm');
  const successEl = document.getElementById('forgotSuccess');
  const errorEl = document.getElementById('forgotError');

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const email = document.getElementById('resetEmail').value;
    const btn = form.querySelector('button[type="submit"]');
    btn.textContent = 'Sending…';
    btn.disabled = true;
    errorEl.style.display = 'none';

    try {
      const res = await fetch('/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      const data = await res.json();
      if (res.ok) {
        successEl.style.display = 'block';
        form.style.display = 'none';
      } else {
        errorEl.textContent = data.error || 'Something went wrong. Please try again.';
        errorEl.style.display = 'block';
      }
    } catch (err) {
      errorEl.textContent = 'Something went wrong. Please try again.';
      errorEl.style.display = 'block';
    } finally {
      btn.textContent = 'Send Reset Link →';
      btn.disabled = false;
    }
  });
})();
</script>

</body>
</html>
