<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Kōdō</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #F4F3F0;
      color: #111110;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Top bar ── */
    .top-bar {
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .top-bar__logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #111110;
    }
    .logo-mark {
      width: 30px;
      height: 30px;
      background: #0A4A5A;
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-text {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 17px;
      letter-spacing: -0.01em;
    }
    .top-bar__back {
      font-size: 13px;
      color: #6B6860;
      text-decoration: none;
    }
    .top-bar__back:hover { color: #111110; }

    /* ── Main ── */
    .auth-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .auth-card {
      background: #FFFFFF;
      border: 1px solid #D4D0C8;
      width: 100%;
      max-width: 400px;
      padding: 40px;
    }
    .auth-eyebrow {
      font-family: 'Syne', sans-serif;
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #0A4A5A;
      margin-bottom: 12px;
    }
    .auth-heading {
      font-family: 'Syne', sans-serif;
      font-size: 1.625rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #111110;
      margin-bottom: 28px;
    }

    /* ── Form ── */
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #6B6860;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 10px 12px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.9375rem;
      color: #111110;
      background: #F9F8F5;
      border: 1px solid #D4D0C8;
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }
    .form-input:focus {
      border-color: #0A4A5A;
      background: #FFFFFF;
    }
    .form-input::placeholder { color: #A8A49C; }

    /* ── Error ── */
    .auth-error {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: #B91C1C;
      font-size: 0.8125rem;
      padding: 10px 12px;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    /* ── Button ── */
    .btn-primary {
      width: 100%;
      padding: 12px;
      background: #0A4A5A;
      color: #FFFFFF;
      font-family: 'Syne', sans-serif;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 4px;
    }
    .btn-primary:hover { background: #0c5a6e; }
    .btn-primary:active { background: #083d4a; }

    /* ── Footer links ── */
    .auth-footer {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #E8E6E1;
    }
    .auth-footer p {
      font-size: 0.8125rem;
      color: #6B6860;
      line-height: 1.6;
    }
    .auth-footer a {
      color: #0A4A5A;
      text-decoration: none;
      font-weight: 500;
    }
    .auth-footer a:hover { text-decoration: underline; }
    .auth-footer .divider { margin: 10px 0; border: none; border-top: 1px solid #E8E6E1; }

    /* ── Bottom note ── */
    .auth-note {
      text-align: center;
      padding: 20px;
      font-size: 0.75rem;
      color: #A8A49C;
    }
  </style>
</head>
<body>

<div class="top-bar">
  <a href="/" class="top-bar__logo">
    <div class="logo-mark">K</div>
    <span class="logo-text">Kōdō</span>
  </a>
  <a href="/" class="top-bar__back">← kodohospitality.com</a>
</div>

<div class="auth-wrap">
  <div class="auth-card">
    <p class="auth-eyebrow">Platform Access</p>
    <h1 class="auth-heading">Welcome back.</h1>

    {% if error %}
    <div class="auth-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input class="form-input" type="email" id="email" name="email"
               placeholder="you@company.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" name="password"
               placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary">Sign in →</button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a href="/register">Start with Observer →</a></p>
      <hr class="divider">
      <p>Forgot your password? Email <a href="mailto:support@kodohospitality.com">support@kodohospitality.com</a></p>
    </div>
  </div>
</div>

<p class="auth-note">© 2026 Kōdō Hospitality · Morocco Hospitality Intelligence</p>

</body>
</html>
